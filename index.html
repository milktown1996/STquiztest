<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>季考閱片刷題</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #1a1f27;
    --panel2: #222834;
    --text: #e8ebf0;
    --muted: #8b93a3;
    --accent: #4f8cff;
    --good: #35c37a;
    --bad: #e5534b;
    --star: #f2c94c;
    --border: #2c3341;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; margin-right: auto; }
  select, button, input {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  input[type="text"] { cursor: text; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
  button.good { background: var(--good); border-color: var(--good); color: white; }
  button.bad { background: var(--bad); border-color: var(--bad); color: white; }
  button.star-btn { font-size: 16px; }
  button.star-btn.active { background: var(--star); border-color: var(--star); color: #3a2e00; }
  button.hide-btn.active { background: var(--muted); border-color: var(--muted); color: #1a1f27; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }
  /* 桌機：刷題畫面加寬，讓兩張影像可以並排顯示（首頁維持原本較窄的版面） */
  @media (min-width: 701px) {
    body.quiz-mode main { max-width: min(1760px, 96vw); }
  }

  /* 首頁 */
  .home-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
  }
  .home-card h2 { margin-top: 0; font-size: 20px; }
  .field-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .field { flex: 1 1 160px; display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field select, .field input { width: 100%; }
  .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 12px; font-size: 13px; cursor: pointer; user-select: none;
  }
  .chip input { display: none; }
  .chip.checked { background: var(--accent); border-color: var(--accent); color: white; }
  .home-summary { font-size: 13px; color: var(--muted); margin: 16px 0; display: flex; gap: 16px; flex-wrap: wrap; }
  .home-summary b { color: var(--text); }
  .start-btn { width: 100%; padding: 14px; font-size: 16px; margin-top: 8px; }

  .stat-bar {
    display: flex; gap: 16px; font-size: 13px; color: var(--muted);
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .stat-bar span b { color: var(--text); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }
  /* 卡片頂端：題號資訊 + 工具列整合在同一列，下方全部留給影像 */
  .card-top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  .card-info {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 13px; color: var(--muted);
  }
  /* 底片帶：案例圖與答案圖全部排在同一條橫向帶上，桌機兩張並排 */
  .film-strip {
    display: flex;
    flex-wrap: nowrap;
    align-items: stretch;
    gap: 10px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 6px;
    height: clamp(320px, calc(100vh - 230px), 900px);
  }
  .film-strip > img,
  .film-strip > .answer-slot {
    flex: 0 0 calc(50% - 5px); /* 一次並排兩張，第三張以後橫向捲動 */
    height: 100%;
    border-radius: 8px;
    background: #000;
  }
  .film-strip > img {
    display: block;
    width: 100%;
    object-fit: contain;
    border: 1px solid var(--border);
  }
  .answer-slot {
    position: relative;
    overflow: hidden;
    border: 1px dashed var(--border);
  }
  .answer-slot img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    filter: blur(24px) brightness(0.5);
    transform: scale(1.03);
    transition: filter 0.25s ease;
  }
  .answer-slot.revealed img {
    filter: none;
  }
  /* 手機/窄螢幕：一次顯示一張，滑動切換 */
  @media (max-width: 700px) {
    .film-strip {
      height: clamp(280px, calc(100vh - 260px), 620px);
    }
    .film-strip > img,
    .film-strip > .answer-slot {
      flex: 0 0 86vw;
    }
  }
  .answer-cover {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.25);
    cursor: pointer;
  }
  .answer-cover span {
    background: var(--accent);
    color: white;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
  }
  /* 單題筆記 */
  .note-panel { margin-top: 10px; }
  .note-panel textarea {
    width: 100%;
    min-height: 90px;
    resize: vertical;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.6;
    cursor: text;
  }
  .note-panel textarea:focus { outline: 1px solid var(--accent); }
  button.note-btn.active { background: #6b4fbb; border-color: #6b4fbb; color: #fff; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .controls button { padding: 7px 11px; font-size: 13px; }
  body.quiz-mode footer { padding: 12px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 30px; }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
  }
  /* 拼音複習 */
  .spell-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .spell-list { display: flex; flex-direction: column; gap: 2px; }
  .spell-row {
    display: flex; align-items: baseline; gap: 10px;
    padding: 7px 12px; border-radius: 8px;
  }
  .spell-row:nth-child(odd) { background: var(--panel2); }
  .spell-name { font-size: 15px; letter-spacing: 0.2px; }
  .spell-idx { color: var(--muted); font-size: 12px; min-width: 32px; text-align: right; }
  .spell-sub { color: var(--muted); font-size: 11px; }
  body.spell-blurred .spell-name {
    filter: blur(5px);
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  body.spell-blurred .spell-row:hover .spell-name,
  body.spell-blurred .spell-name.shown { filter: none; }
  .spell-img-btn {
    padding: 2px 8px; font-size: 12px; border-radius: 6px;
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
  }
  .spell-img-btn:hover { color: var(--text); border-color: var(--accent); }
  .spell-img-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .spell-images {
    display: flex; flex-wrap: nowrap; gap: 8px;
    overflow-x: auto; overflow-y: hidden;
    padding: 8px 0 10px 42px;
  }
  .spell-images img {
    flex: 0 0 auto; height: min(42vh, 380px); width: auto;
    object-fit: contain; background: #000;
    border: 1px solid var(--border); border-radius: 6px;
  }
  @media (max-width: 700px) {
    .spell-images { padding-left: 0; }
    .spell-images img { height: auto; width: 86vw; }
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header id="appHeader">
  <h1>🧠 季考閱片刷題</h1>
  <button id="homeBtn" class="hidden">🏠 回首頁</button>
  <button id="exportNotesBtn">📤 匯出筆記</button>
  <button id="resetStatBtn">重置紀錄</button>
</header>

<main>

  <!-- 首頁：篩選與搜尋 -->
  <div id="homeView">
    <div class="home-card">
      <h2>開始刷題</h2>

      <div class="field-row">
        <div class="field" style="flex: 2 1 280px;">
          <label>科目（可複選，不勾選 = 全部）</label>
          <div class="checkbox-group" id="subjectCheckboxes"></div>
        </div>
        <div class="field" style="flex: 2 1 280px;">
          <label>年份（可複選，不勾選 = 全部）</label>
          <div class="checkbox-group" id="yearCheckboxes"></div>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>單元</label>
          <select id="sectionFilter"><option value="">全部單元</option></select>
        </div>
        <div class="field">
          <label>院區</label>
          <select id="hospitalFilter"><option value="">全部院區</option></select>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>模式</label>
          <select id="modeFilter">
            <option value="all">全部題目</option>
            <option value="untouched">🆕 只看沒碰過的題目</option>
            <option value="wrongOnly">只練錯題</option>
            <option value="favOnly">⭐ 只看收藏</option>
            <option value="disputedOnly">⚠ 只看答案疑慮</option>
            <option value="hiddenOnly">🙈 只看已隱藏（管理用）</option>
          </select>
        </div>
        <div class="field" style="flex: 2 1 260px;">
          <label>搜尋（題號或診斷關鍵字，如 ST20240530 / meningioma）</label>
          <input type="text" id="searchInput" placeholder="輸入題號或診斷關鍵字...">
        </div>
      </div>

      <div class="field-row">
        <button id="clearFiltersBtn">🧹 清除所有篩選條件</button>
      </div>

      <div class="home-summary">
        <span>符合篩選題數: <b id="matchCount">0</b></span>
        <span>🆕 沒碰過: <b id="homeUntouched">0</b></span>
        <span>⭐ 收藏: <b id="homeFav">0</b></span>
        <span>❌ 累積錯題: <b id="homeWrong">0</b></span>
        <span>⚠ 答案疑慮: <b id="homeDisputed">0</b></span>
        <span>🙈 已隱藏: <b id="homeHidden">0</b></span>
      </div>

      <button class="start-btn" id="spellBtn">🔤 難拼字疾病名稱複習</button>
      <button class="primary start-btn" id="startBtn">▶ 開始刷題（隨機順序）</button>
      <button class="start-btn" id="startYearDescBtn">▶ 開始刷題（年份新到舊）</button>
    </div>
  </div>

  <!-- 拼音複習畫面 -->
  <div id="spellView" class="hidden">
    <div class="card">
      <div class="spell-toolbar">
        <strong>🔤 難拼字疾病名稱</strong>
        <select id="spellSubject"><option value="">全部科目</option></select>
        <input type="text" id="spellSearch" placeholder="搜尋名稱...">
        <button id="spellBlurToggle">👁 遮蔽模式（滑過才顯示）</button>
        <span class="spell-sub" id="spellCount"></span>
      </div>
      <div class="spell-list" id="spellList"></div>
    </div>
  </div>

  <!-- 刷題畫面 -->
  <div id="quizView" class="hidden">
    <div class="stat-bar">
      <span>本次已答: <b id="statAnswered">0</b></span>
      <span>答對: <b id="statCorrect">0</b></span>
      <span>答錯: <b id="statWrong">0</b></span>
      <span>快捷鍵: Enter 看答案　← → 捲動影像　↑ ↓ 上下題</span>
    </div>
    <div id="quizArea"></div>
  </div>

</main>

<footer>資料來源：季考閱片題目順序（全科目）／僅供個人複習使用</footer>

<script>
const STORAGE_KEY = "quiz_progress_v4";

let questions = [];
let pool = [];
let idx = 0;
// 本次作答中已揭曉過答案的題目：回上一題時維持已揭曉狀態，答對/答錯才不會又被鎖住
let revealedIds = new Set();

const DEFAULT_PROGRESS = {
  wrong: {}, correct: {}, favorites: {}, hidden: {}, notes: {},
  sessionAnswered: 0, sessionCorrect: 0, sessionWrong: 0
};

function loadProgress() {
  try {
    return Object.assign(
      structuredClone(DEFAULT_PROGRESS),
      JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}
    );
  } catch (e) {
    return structuredClone(DEFAULT_PROGRESS);
  }
}
let progress = loadProgress();

function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- 首頁 ---------- */

function buildCheckboxGroup(containerId, values, onChange) {
  const container = document.getElementById(containerId);
  container.innerHTML = "";
  values.forEach(v => {
    const label = document.createElement("label");
    label.className = "chip";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.value = v;
    input.addEventListener("change", () => {
      label.classList.toggle("checked", input.checked);
      onChange();
    });
    const span = document.createElement("span");
    span.textContent = v;
    label.appendChild(input);
    label.appendChild(span);
    container.appendChild(label);
  });
}

function getCheckedValues(containerId) {
  return [...document.querySelectorAll(`#${containerId} input:checked`)].map(i => i.value);
}

function populateFilters() {
  const sectionSel = document.getElementById("sectionFilter");
  const hospSel = document.getElementById("hospitalFilter");

  const subjects = [...new Set(questions.map(q => q.subject).filter(Boolean))].sort();
  const years = [...new Set(questions.map(q => q.year).filter(Boolean))].sort().reverse();

  buildCheckboxGroup("subjectCheckboxes", subjects, () => { refillDependent(); updateHomeSummary(); });
  buildCheckboxGroup("yearCheckboxes", years, updateHomeSummary);

  function refillDependent() {
    const selectedSubjects = getCheckedValues("subjectCheckboxes");
    const scoped = selectedSubjects.length
      ? questions.filter(q => selectedSubjects.includes(q.subject))
      : questions;

    const curSection = sectionSel.value;
    const curHosp = hospSel.value;
    sectionSel.innerHTML = '<option value="">全部單元</option>';
    hospSel.innerHTML = '<option value="">全部院區</option>';

    [...new Set(scoped.map(q => q.section).filter(Boolean))].sort().forEach(s => {
      const o = document.createElement("option");
      o.value = s; o.textContent = s;
      sectionSel.appendChild(o);
    });
    [...new Set(scoped.map(q => q.hospital).filter(Boolean))].sort().forEach(h => {
      const o = document.createElement("option");
      o.value = h; o.textContent = h;
      hospSel.appendChild(o);
    });
    if ([...sectionSel.options].some(o => o.value === curSection)) sectionSel.value = curSection;
    if ([...hospSel.options].some(o => o.value === curHosp)) hospSel.value = curHosp;
  }

  sectionSel.addEventListener("change", updateHomeSummary);
  hospSel.addEventListener("change", updateHomeSummary);
  document.getElementById("modeFilter").addEventListener("change", updateHomeSummary);
  document.getElementById("searchInput").addEventListener("input", updateHomeSummary);
  // 「清除所有篩選條件」按下後，重建單元/院區選項（回到涵蓋全部題目的狀態）
  document.getElementById("subjectCheckboxes")
    .addEventListener("filters-cleared", refillDependent);

  refillDependent();
}

// 「碰過」= 答對過、答錯過、收藏、標記隱藏、或寫過筆記，任一即算
function isTouched(q) {
  return !!(
    progress.correct[q.id] ||
    progress.wrong[q.id] ||
    progress.favorites[q.id] ||
    progress.hidden[q.id] ||
    (progress.notes[q.id] || "").trim()
  );
}

function getFilteredQuestions() {
  const selectedSubjects = getCheckedValues("subjectCheckboxes");
  const selectedYears = getCheckedValues("yearCheckboxes");
  const section = document.getElementById("sectionFilter").value;
  const hospital = document.getElementById("hospitalFilter").value;
  const mode = document.getElementById("modeFilter").value;
  const search = document.getElementById("searchInput").value.trim().toLowerCase();

  return questions.filter(q => {
    if (selectedSubjects.length && !selectedSubjects.includes(q.subject)) return false;
    if (selectedYears.length && !selectedYears.includes(String(q.year))) return false;
    if (section && q.section !== section) return false;
    if (hospital && q.hospital !== hospital) return false;
    if (mode === "untouched" && isTouched(q)) return false;
    if (mode === "wrongOnly" && !progress.wrong[q.id]) return false;
    if (mode === "favOnly" && !progress.favorites[q.id]) return false;
    if (mode === "disputedOnly" && !q.disputed) return false;
    if (mode === "hiddenOnly" && !progress.hidden[q.id]) return false;
    if (mode !== "hiddenOnly" && progress.hidden[q.id]) return false; // 預設排除已隱藏
    if (search) {
      const hay = (q.id + " " + (q.diagnosis || "")).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });
}

function updateHomeSummary() {
  const filtered = getFilteredQuestions();
  document.getElementById("matchCount").textContent = filtered.length;
  document.getElementById("homeUntouched").textContent = questions.filter(q => !isTouched(q)).length;
  document.getElementById("homeFav").textContent = Object.keys(progress.favorites).length;
  document.getElementById("homeWrong").textContent = Object.keys(progress.wrong).length;
  document.getElementById("homeDisputed").textContent = questions.filter(q => q.disputed).length;
  document.getElementById("homeHidden").textContent = Object.keys(progress.hidden).length;
}

function updateStatBar() {
  document.getElementById("statAnswered").textContent = progress.sessionAnswered;
  document.getElementById("statCorrect").textContent = progress.sessionCorrect;
  document.getElementById("statWrong").textContent = progress.sessionWrong;
}

function showHome() {
  document.getElementById("homeView").classList.remove("hidden");
  document.getElementById("quizView").classList.add("hidden");
  document.getElementById("spellView").classList.add("hidden");
  document.getElementById("homeBtn").classList.add("hidden");
  document.body.classList.remove("quiz-mode");
  updateHomeSummary();
}

function sortByYearDesc(arr) {
  return arr.slice().sort((a, b) => {
    const yearDiff = (parseInt(b.year, 10) || 0) - (parseInt(a.year, 10) || 0);
    if (yearDiff !== 0) return yearDiff;
    return b.id.localeCompare(a.id); // 同年份內，id 本身帶日期字串，新到舊
  });
}

function startQuiz(order) {
  // order: "shuffle" | "original" | "yearDesc"
  const filtered = getFilteredQuestions();
  if (filtered.length === 0) {
    alert("目前篩選條件下沒有題目");
    return;
  }
  if (order === "shuffle") pool = shuffle(filtered);
  else if (order === "yearDesc") pool = sortByYearDesc(filtered);
  else pool = filtered;
  idx = 0;
  revealedIds = new Set(); // 新一輪開始，答案一律重新遮蔽
  document.getElementById("homeView").classList.add("hidden");
  document.getElementById("spellView").classList.add("hidden");
  document.getElementById("quizView").classList.remove("hidden");
  document.getElementById("homeBtn").classList.remove("hidden");
  document.body.classList.add("quiz-mode");
  updateStatBar();
  renderCard();
}

/* ---------- 刷題畫面 ---------- */

function renderCard() {
  const area = document.getElementById("quizArea");
  if (pool.length === 0) {
    area.innerHTML = `<div class="card empty">目前篩選條件下沒有題目 😶</div>`;
    return;
  }
  if (idx >= pool.length) idx = 0;
  const q = pool[idx];

  const caseImgsHtml = q.caseImages.map(img => `<img src="images/${encodeURIComponent(img)}" loading="lazy">`).join("");
  const disputedBadge = q.disputed ? `<span class="badge" style="border-color:#e5a53b;color:#e5a53b">答案疑慮</span>` : "";
  const exchangeBadge = q.isExchange ? `<span class="badge" style="border-color:var(--accent);color:var(--accent)">交換考題</span>` : "";
  const wrongBadge = progress.wrong[q.id] ? `<span class="badge" style="border-color:var(--bad);color:var(--bad)">曾答錯</span>` : "";
  const isFav = !!progress.favorites[q.id];
  const isHidden = !!progress.hidden[q.id];
  const noteText = progress.notes[q.id] || "";
  const hasNote = !!noteText.trim();
  const wasRevealed = revealedIds.has(q.id); // 已看過答案的題目，回頭時維持揭曉狀態

  area.innerHTML = `
    <div class="card">
      <div class="card-top">
        <div class="card-info">
          <span>第 ${idx + 1} / ${pool.length} 題　${q.id}</span>
          <span class="badge">${q.subject || ""}</span>
          <span class="badge">${q.section || ""}</span>
          <span class="badge">${q.hospital || ""} ${q.year || ""}</span>
          ${exchangeBadge}${disputedBadge}${wrongBadge}
        </div>
        <div class="controls">
          <button class="star-btn ${isFav ? "active" : ""}" id="favBtn">${isFav ? "⭐ 已收藏" : "☆ 收藏此題"}</button>
          <button class="hide-btn ${isHidden ? "active" : ""}" id="hideBtn">${isHidden ? "🙈 已標記隱藏，下輪生效（點擊取消）" : "🙈 隱藏此題"}</button>
          <button class="note-btn ${hasNote ? "active" : ""}" id="noteBtn">📝 ${hasNote ? "已有筆記" : "筆記"}</button>
          <button class="good" id="correctBtn" ${wasRevealed ? "" : "disabled"}>✅ 我答對了</button>
          <button class="bad" id="wrongBtn" ${wasRevealed ? "" : "disabled"}>❌ 我答錯了</button>
          <button id="prevBtn" ${idx === 0 ? "disabled" : ""}>▲ 上一題</button>
          <button id="nextBtn">▼ 下一題</button>
        </div>
      </div>

      <div class="film-strip" id="filmStrip">
        ${caseImgsHtml}
        <div class="answer-slot ${wasRevealed ? "revealed" : ""}" id="answerWrap">
          <img src="images/${encodeURIComponent(q.answerImage)}">
          <div class="answer-cover" id="answerCover" ${wasRevealed ? 'style="display:none"' : ""}><span>👁 點擊看答案</span></div>
        </div>
      </div>

      <div class="note-panel ${hasNote ? "" : "hidden"}" id="notePanel">
        <textarea id="noteInput" placeholder="輸入這一題的筆記（自動儲存在這台裝置的瀏覽器）">${escapeHtml(noteText)}</textarea>
      </div>
    </div>
  `;

  document.getElementById("answerCover").onclick = revealAnswer;
  document.getElementById("favBtn").onclick = () => toggleFavorite(q);
  document.getElementById("hideBtn").onclick = () => toggleHidden(q);
  document.getElementById("noteBtn").onclick = () => {
    const panel = document.getElementById("notePanel");
    panel.classList.toggle("hidden");
    if (!panel.classList.contains("hidden")) document.getElementById("noteInput").focus();
  };
  document.getElementById("noteInput").addEventListener("input", (e) => {
    const v = e.target.value;
    if (v.trim()) progress.notes[q.id] = v;
    else delete progress.notes[q.id];
    saveProgress();
    const btn = document.getElementById("noteBtn");
    const has = !!(progress.notes[q.id] || "").trim();
    btn.classList.toggle("active", has);
    btn.textContent = has ? "📝 已有筆記" : "📝 筆記";
  });
  document.getElementById("correctBtn").onclick = () => markAndNext(q, true);
  document.getElementById("wrongBtn").onclick = () => markAndNext(q, false);
  document.getElementById("nextBtn").onclick = () => { idx++; renderCard(); };
  document.getElementById("prevBtn").onclick = () => { if (idx > 0) { idx--; renderCard(); } };

  // 滑鼠停留在底片帶上時，滾輪（垂直）轉成橫向捲動，不觸發整頁上下捲動
  const strip = document.getElementById("filmStrip");
  if (strip) {
    strip.addEventListener("wheel", (e) => {
      if (strip.scrollWidth <= strip.clientWidth) return;
      e.preventDefault();
      let delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
      // 不同瀏覽器的 deltaMode 單位不同：0=像素、1=行、2=頁
      if (e.deltaMode === 1) delta *= 40;
      else if (e.deltaMode === 2) delta *= strip.clientWidth;
      strip.scrollLeft += delta * 2.5; // 放大捲動幅度，大張影像才不會滾很久
    }, { passive: false });
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function revealAnswer() {
  const wrap = document.getElementById("answerWrap");
  const cover = document.getElementById("answerCover");
  if (!wrap || !cover || wrap.classList.contains("revealed")) return;
  if (pool[idx]) revealedIds.add(pool[idx].id);
  wrap.classList.add("revealed");
  cover.style.display = "none";
  document.getElementById("correctBtn").disabled = false;
  document.getElementById("wrongBtn").disabled = false;
  // 答案圖在底片帶最右側，揭曉後自動橫向捲過去（不改變頁面垂直位置）
  const strip = document.getElementById("filmStrip");
  if (strip) strip.scrollTo({ left: strip.scrollWidth, behavior: "smooth" });
}

function toggleFavorite(q) {
  if (progress.favorites[q.id]) {
    delete progress.favorites[q.id];
  } else {
    progress.favorites[q.id] = true;
  }
  saveProgress();
  renderCard();
}

function toggleHidden(q) {
  if (progress.hidden[q.id]) {
    delete progress.hidden[q.id];
  } else {
    progress.hidden[q.id] = true;
  }
  saveProgress();
  // 只標記、不立即移出本輪題目；下次重新開始刷題時才會依篩選條件排除
  renderCard();
}

function markAndNext(q, isCorrect) {
  progress.sessionAnswered++;
  if (isCorrect) {
    progress.sessionCorrect++;
    delete progress.wrong[q.id];
    progress.correct[q.id] = true;
  } else {
    progress.sessionWrong++;
    progress.wrong[q.id] = true;
  }
  saveProgress();
  updateStatBar();
  idx++;
  renderCard();
}

document.getElementById("clearFiltersBtn").onclick = () => {
  document.querySelectorAll("#subjectCheckboxes input, #yearCheckboxes input").forEach(i => {
    i.checked = false;
    i.closest(".chip").classList.remove("checked");
  });
  document.getElementById("sectionFilter").value = "";
  document.getElementById("hospitalFilter").value = "";
  document.getElementById("modeFilter").value = "all";
  document.getElementById("searchInput").value = "";
  // 科目清空後，單元/院區選項要回到涵蓋全部題目的狀態
  document.getElementById("subjectCheckboxes").dispatchEvent(new Event("filters-cleared"));
  updateHomeSummary();
};

document.getElementById("startBtn").onclick = () => startQuiz("shuffle");
document.getElementById("startYearDescBtn").onclick = () => startQuiz("yearDesc");
document.getElementById("homeBtn").onclick = showHome;
document.getElementById("exportNotesBtn").onclick = () => {
  const ids = Object.keys(progress.notes).filter(id => (progress.notes[id] || "").trim());
  if (ids.length === 0) {
    alert("目前沒有任何筆記");
    return;
  }
  const byId = Object.fromEntries(questions.map(q => [q.id, q]));
  const lines = ["# 季考閱片刷題筆記", ""];
  ids.sort().forEach(id => {
    const q = byId[id];
    const meta = q ? `${q.subject} / ${q.hospital} ${q.year}${q.diagnosis ? " / " + q.diagnosis : ""}` : "";
    lines.push(`## ${id}${meta ? "　(" + meta + ")" : ""}`, "", progress.notes[id].trim(), "");
  });
  const blob = new Blob([lines.join("\n")], { type: "text/markdown;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `季考閱片刷題筆記_${new Date().toISOString().slice(0, 10)}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("resetStatBtn").onclick = () => {
  if (confirm("確定要重置作答紀錄與錯題統計嗎？（收藏與隱藏清單不會被清除）")) {
    progress.wrong = {};
    progress.correct = {};
    progress.sessionAnswered = 0;
    progress.sessionCorrect = 0;
    progress.sessionWrong = 0;
    saveProgress();
    updateHomeSummary();
    updateStatBar();
  }
};

/* ---------- 拼音複習 ---------- */

let spellItems = [];

function renderSpellList() {
  const subj = document.getElementById("spellSubject").value;
  const kw = document.getElementById("spellSearch").value.trim().toLowerCase();
  const list = spellItems.filter(it => {
    if (subj && !it.subjects.includes(subj)) return false;
    if (kw && !it.name.toLowerCase().includes(kw)) return false;
    return true;
  });
  document.getElementById("spellCount").textContent = `共 ${list.length} 個`;
  document.getElementById("spellList").innerHTML = list.map((it, i) => {
    const n = (it.questionIds || []).length;
    const imgBtn = n
      ? `<button class="spell-img-btn" data-idx="${i}">🖼 ${n} 題影像</button>`
      : `<span class="spell-sub">（無對應影像）</span>`;
    return `
      <div>
        <div class="spell-row">
          <span class="spell-idx">${i + 1}.</span>
          <span class="spell-name">${escapeHtml(it.name)}</span>
          <span class="spell-sub">${escapeHtml(it.subjects.join(" / "))}</span>
          ${imgBtn}
        </div>
        <div class="spell-images hidden" id="spellImgs${i}"></div>
      </div>`;
  }).join("");

  // 遮蔽模式下，點擊名稱可固定顯示該筆
  document.querySelectorAll("#spellList .spell-name").forEach(el => {
    el.onclick = () => el.classList.toggle("shown");
  });

  // 點擊影像按鈕展開/收合該疾病所有 citation 的影像
  document.querySelectorAll("#spellList .spell-img-btn").forEach(btn => {
    btn.onclick = () => {
      const i = btn.dataset.idx;
      const box = document.getElementById("spellImgs" + i);
      const open = box.classList.toggle("hidden");
      btn.classList.toggle("active", !open);
      if (!open && !box.dataset.loaded) {
        const byId = Object.fromEntries(questions.map(q => [q.id, q]));
        const imgs = [];
        (list[i].questionIds || []).forEach(qid => {
          const q = byId[qid];
          if (!q) return;
          q.caseImages.forEach(im => imgs.push(im));
          imgs.push(q.answerImage);
        });
        box.innerHTML = imgs.length
          ? imgs.map(im => `<img src="images/${encodeURIComponent(im)}" loading="lazy">`).join("")
          : `<span class="spell-sub">找不到對應影像（題目可能不在題庫中）</span>`;
        box.dataset.loaded = "1";
      }
    };
  });
}

function showSpell() {
  document.getElementById("homeView").classList.add("hidden");
  document.getElementById("quizView").classList.add("hidden");
  document.getElementById("spellView").classList.remove("hidden");
  document.getElementById("homeBtn").classList.remove("hidden");
  document.body.classList.remove("quiz-mode");

  if (spellItems.length === 0) {
    fetch("spelling.json")
      .then(r => r.json())
      .then(data => {
        spellItems = data;
        const sel = document.getElementById("spellSubject");
        [...new Set(data.flatMap(i => i.subjects))].sort().forEach(sub => {
          const o = document.createElement("option");
          o.value = sub; o.textContent = sub;
          sel.appendChild(o);
        });
        renderSpellList();
      })
      .catch(err => {
        document.getElementById("spellList").innerHTML =
          `<div class="empty">載入拼音清單失敗：${err}</div>`;
      });
  } else {
    renderSpellList();
  }
}

document.getElementById("spellBtn").onclick = showSpell;
document.getElementById("spellSubject").onchange = renderSpellList;
document.getElementById("spellSearch").oninput = renderSpellList;
document.getElementById("spellBlurToggle").onclick = (e) => {
  const on = document.body.classList.toggle("spell-blurred");
  e.target.textContent = on ? "👁 遮蔽中（點擊關閉）" : "👁 遮蔽模式（滑過才顯示）";
  e.target.classList.toggle("primary", on);
};

// 鍵盤快捷鍵（僅在刷題畫面啟用）：
//   Enter 看答案、← → 橫向捲動影像、↑ 上一題、↓ 下一題
document.addEventListener("keydown", (e) => {
  if (document.getElementById("quizView").classList.contains("hidden")) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;

  const strip = document.getElementById("filmStrip");
  const step = strip ? Math.max(200, strip.clientWidth * 0.6) : 0;

  if (e.key === "Enter") {
    e.preventDefault();
    revealAnswer();
  } else if (e.key === "ArrowRight") {
    e.preventDefault();
    strip?.scrollBy({ left: step, behavior: "smooth" });
  } else if (e.key === "ArrowLeft") {
    e.preventDefault();
    strip?.scrollBy({ left: -step, behavior: "smooth" });
  } else if (e.key === "ArrowDown") {
    e.preventDefault();
    document.getElementById("nextBtn")?.click();
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    document.getElementById("prevBtn")?.click();
  }
});

fetch("questions.json")
  .then(r => r.json())
  .then(data => {
    questions = data;
    populateFilters();
    showHome();
  })
  .catch(err => {
    document.getElementById("homeView").innerHTML = `<div class="card empty">載入題庫失敗：${err}</div>`;
  });
</script>
